spring:
  application:
    name: crud

  datasource:
    url: jdbc:mysql://localhost:3306/crud_basic?createDatabaseIfNotExist=true
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
